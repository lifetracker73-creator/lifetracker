<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#fff8f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1a24" media="(prefers-color-scheme: dark)">
  <title>Lifetracker</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Lifetracker">
  <link rel="stylesheet" href="core/styles.css">
  <!-- Start in the phone's light/dark setting; core/appearance.js then applies your saved choice. -->
  <script>
    document.documentElement.dataset.mode =
      window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    // Hide the title bar and menu until we know whether the first-time welcome shows (REFINE-4).
    // Shown again after 4 s anyway, just in case something goes wrong.
    document.documentElement.classList.add('app-starting');
    setTimeout(() => document.documentElement.classList.remove('app-starting'), 4000);
  </script>
</head>
<body>
  <!-- App shell (CORE-3): title bar, screen area, bottom menu bar and the "More" panel. -->
  <header class="app-header">
    <div class="app-header__inner">
      <span id="screen-badge"></span>
      <h1 id="screen-title" class="app-header__title" tabindex="-1">Lifetracker</h1>
      <button id="sync-status" class="sync-status" type="button" aria-haspopup="dialog" hidden></button>
      <button id="mode-toggle" class="mode-toggle" type="button"></button>
      <a id="settings-link" class="mode-toggle settings-link" href="#/settings" aria-label="Settings"><span aria-hidden="true">⚙️</span></a>
    </div>
  </header>
  <main id="app" class="page app-main"></main>
  <nav id="bottom-nav" class="bottom-nav" aria-label="Main menu"></nav>
  <dialog id="more-sheet" class="sheet" aria-labelledby="more-title"></dialog>
  <dialog id="sync-sheet" class="sheet" aria-labelledby="sync-title"></dialog>

  <script type="module">
    import { el, badge, button, card, modules } from './core/ui.js';
    import { startRouter } from './core/router.js';
    import { getSettings } from './core/storage.js';
    import { today, currentHour, formatDate, addDays } from './core/dates.js';
    import { buddy, withName } from './core/buddy.js';
    import { startSync, onStatus, syncNow } from './core/sync.js';
    import { startAppearance, setAppearance, isDark } from './core/appearance.js';
    import { getMenu } from './core/menu.js';
    import { todaySection, summaryCard, readingBanner, fillTileStats, quickAdd, loggingStreak } from './core/home.js';

    // 🍄 Things the buddy says when you tap it on Home (REFINE-2).
    const BUDDY_LINES = [
      'Hi hi! 👋', "You're doing great! 🌸", 'Sip some water? 💧', 'Proud of you ✨',
      'One small step at a time 🐾', 'Take a deep breath 🍃', "Let's have a lovely day 🌈",
    ];
    let cheeredStreakOn = ''; // the day the streak hop was shown (only once a day while the app is open)

    // ☀️/🌙 button in the title bar: switches between light and dark.
    // (Settings → Appearance also has "Auto", colour themes and fonts.)
    const modeToggle = document.getElementById('mode-toggle');
    function paintModeToggle() {
      const dark = isDark();
      modeToggle.textContent = dark ? '☀️' : '🌙';
      modeToggle.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
    }
    document.addEventListener('appearancechange', paintModeToggle);
    modeToggle.addEventListener('click', () => setAppearance({ mode: isDark() ? 'light' : 'dark' }));
    paintModeToggle();
    startAppearance();

    // Modules on the bottom bar; the rest sit in the "More" panel. Your choice from
    // Settings → Customise menu (CORE-8); it also sets the order of the home tiles.
    let menu = await getMenu();
    let moreModules = menu.order.filter((key) => !menu.bar.includes(key));

    const app = document.getElementById('app');
    const nav = document.getElementById('bottom-nav');
    const sheet = document.getElementById('more-sheet');
    const titleEl = document.getElementById('screen-title');
    const badgeEl = document.getElementById('screen-badge');

    // A big pastel tile that opens a module (home screen and "More" panel).
    function tile(key) {
      return el('a', { className: `tile mod-${key}`, href: `#/${key}` }, [
        el('span', { className: 'tile__emoji', 'aria-hidden': 'true', text: modules[key].emoji }),
        el('span', { text: modules[key].label }),
      ]);
    }

    // One button on the bottom bar.
    function navItem({ key, emoji, label, href, onClick }) {
      const attrs = { className: `nav-item${modules[key] ? ` mod-${key}` : ''}`, 'data-key': key };
      const inner = [
        el('span', { className: 'nav-item__emoji', 'aria-hidden': 'true', text: emoji }),
        el('span', { text: label }),
      ];
      return href
        ? el('a', { ...attrs, href }, inner)
        : el('button', { ...attrs, type: 'button', 'aria-haspopup': 'dialog', onClick }, inner);
    }

    const moreButton = navItem({ key: 'more', emoji: '🌈', label: 'More', onClick: () => sheet.showModal() });
    const moreGrid = el('div', { className: 'tile-grid' });
    // Draws the bottom bar and the More panel's tiles from your menu.
    function drawMenu() {
      nav.replaceChildren(el('div', { className: 'bottom-nav__inner' }, [
        navItem({ key: 'home', emoji: '🏠', label: 'Home', href: '#/' }),
        ...menu.bar.map((key) => navItem({ key, emoji: modules[key].emoji, label: modules[key].label, href: `#/${key}` })),
        moreButton,
      ]));
      moreGrid.replaceChildren(...moreModules.map(tile));
    }
    drawMenu();
    // Changed in Settings → Customise menu: redraw at once.
    document.addEventListener('menuchange', (e) => {
      menu = e.detail;
      moreModules = menu.order.filter((key) => !menu.bar.includes(key));
      drawMenu();
      highlight(currentScreen);
    });

    // "More" panel: tap a tile, tap the ✕, tap outside, or press Back/Escape to close.
    sheet.append(
      el('div', { className: 'sheet__head' }, [
        el('h2', { id: 'more-title', className: 'sheet__title', text: 'More' }),
        button({ icon: 'close', variant: 'ghost', ariaLabel: 'Close', onClick: () => sheet.close() }),
      ]),
      moreGrid,
    );
    sheet.addEventListener('click', (e) => {
      if (e.target === sheet || e.target.closest('.tile')) sheet.close();
    });

    // Google Sync status icon (SHEETS-SYNC): ✅ synced / ⏳ X waiting / ⚠️ problem.
    // Tapping it explains in plain words, with "Try again" and "Settings" buttons.
    const syncButton = document.getElementById('sync-status');
    const syncSheet = document.getElementById('sync-sheet');
    const syncText = el('p', { className: 'sync-sheet__text' });
    const syncWhen = el('p', { className: 'muted sync-sheet__when' });
    syncSheet.append(
      el('div', { className: 'sheet__head' }, [
        el('h2', { id: 'sync-title', className: 'sheet__title', text: 'Google Sync' }),
        button({ icon: 'close', variant: 'ghost', ariaLabel: 'Close', onClick: () => syncSheet.close() }),
      ]),
      syncText,
      syncWhen,
      el('div', { className: 'btn-row' }, [
        button({ label: 'Try again', variant: 'primary', onClick: () => syncNow() }),
        el('a', { className: 'btn btn--secondary', href: '#/settings', onClick: () => syncSheet.close() }, [
          el('span', { text: 'Settings' }),
        ]),
      ]),
    );
    syncSheet.addEventListener('click', (e) => { if (e.target === syncSheet) syncSheet.close(); });
    syncButton.addEventListener('click', () => syncSheet.showModal());
    onStatus((s) => {
      const icon = { synced: '✅', waiting: '⏳', sending: '⏳', problem: '⚠️' }[s.state];
      const short = s.state === 'synced' ? 'Synced'
        : s.state === 'problem' ? 'Sync problem'
        : `${s.waiting} waiting`;
      syncButton.hidden = false;
      syncButton.className = `sync-status sync-status--${s.state}`;
      syncButton.replaceChildren(
        el('span', { 'aria-hidden': 'true', text: icon }),
        ...(s.waiting && s.state !== 'synced' ? [el('span', { text: String(s.waiting) })] : []),
      );
      syncButton.setAttribute('aria-label', `Google Sync: ${short}`);
      syncText.textContent = `${icon} ${s.message}`;
      syncWhen.textContent = s.lastSyncAt
        ? `Last sent: ${new Date(s.lastSyncAt).toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', dateStyle: 'medium', timeStyle: 'short' })}`
        : '';
    });
    startSync();

    // Offline helper (CORE-5): saves the app on the phone so it works with no internet.
    // When a new version has been downloaded, a message offers to switch to it.
    if ('serviceWorker' in navigator) {
      let refreshing = false;
      let updateBanner = null;

      function showUpdateBanner(worker) {
        if (updateBanner || !navigator.serviceWorker.controller) return; // first install: nothing to update
        updateBanner = el('div', { className: 'update-banner', role: 'status' }, [
          button({
            label: '✨ New version available — tap to refresh',
            variant: 'primary',
            block: true,
            onClick: () => {
              refreshing = true;
              worker.postMessage('SKIP_WAITING');
            },
          }),
        ]);
        document.body.append(updateBanner);
      }

      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshing) location.reload();
      });

      navigator.serviceWorker.register('./sw.js').then((reg) => {
        if (reg.waiting) showUpdateBanner(reg.waiting);
        reg.addEventListener('updatefound', () => {
          const worker = reg.installing;
          worker?.addEventListener('statechange', () => {
            if (worker.state === 'installed') showUpdateBanner(worker);
          });
        });
        // Look for a new version whenever the app comes back to the screen.
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') reg.update().catch(() => {});
        });
      }).catch((err) => console.error(err));
    }

    // "Install app" button (CORE-5): shown on Home only when the phone offers to install.
    let installPrompt = null;
    const installSlot = el('div', { className: 'install-slot' });
    function updateInstallSlot() {
      const installed = window.matchMedia('(display-mode: standalone)').matches;
      installSlot.replaceChildren();
      if (!installPrompt || installed) return;
      installSlot.append(button({
        label: '📲 Install app',
        variant: 'secondary',
        block: true,
        onClick: async () => {
          const prompt = installPrompt;
          installPrompt = null;
          updateInstallSlot();
          prompt.prompt();
          await prompt.userChoice.catch(() => null);
        },
      }));
    }
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      installPrompt = e;
      updateInstallSlot();
    });
    window.addEventListener('appinstalled', () => {
      installPrompt = null;
      updateInstallSlot();
    });

    async function homeScreen(root) {
      // Your name comes from the "profile" settings, if one has been saved.
      let name = '';
      try {
        name = ((await getSettings('profile', { name: '' })).name || '').trim();
      } catch (err) {
        console.error(err);
      }
      const hour = currentHour();
      const [greeting, emoji] = hour >= 5 && hour < 12 ? ['Good morning', '☀️']
        : hour >= 12 && hour < 17 ? ['Good afternoon', '🌤️']
        : ['Good evening', '🌙'];

      // 😴 "Going to bed" (from 10 pm) / "I'm awake" (from 6 am) card, from the sleep module.
      const sleepSlot = el('div', { className: 'home-sleep' });
      import('./sleep/index.js')
        .then(({ homeCard }) => homeCard())
        .then((c) => sleepSlot.append(c))
        .catch((err) => console.error(err));

      // Module tiles, each with a small live number (HOME-SUMMARY).
      const tiles = el('div', { className: 'tile-grid' }, menu.order.map(tile));

      // 🍄 Buddy (REFINE-2): sleepy at night or after "Going to bed"; tap it for a hop and a cute line.
      const friend = buddy({ size: 72, mood: hour >= 22 || hour < 6 ? 'sleepy' : 'idle' });
      const say = el('p', { className: 'home-buddy__say', 'aria-live': 'polite' });
      let lineIndex = Math.floor(Math.random() * BUDDY_LINES.length);
      const sleepy = () => friend.classList.contains('buddy--sleepy');
      const buddyButton = el('button', {
        className: 'home-buddy', type: 'button', 'aria-label': 'Say hi to your buddy',
        onClick: () => {
          friend.hop();
          lineIndex = (lineIndex + 1) % BUDDY_LINES.length;
          say.textContent = withName(sleepy() ? '{name}: Zzz… sweet dreams 🌙' : `{name} says: ${BUDDY_LINES[lineIndex]}`);
        },
      }, [friend]);
      getSettings('sleep', { pendingBedTime: null })
        .then((s) => { if (s.pendingBedTime) friend.setMood('sleepy'); })
        .catch((err) => console.error(err));
      const onSleep = (e) => {
        if (!friend.isConnected) { document.removeEventListener('sleepchange', onSleep); return; }
        friend.setMood(e.detail.sleeping || hour >= 22 || hour < 6 ? 'sleepy' : 'idle');
      };
      document.addEventListener('sleepchange', onSleep);
      // 🔥 First Home visit of the day with a streak of 2+ days that includes today: a happy hop.
      loggingStreak(today()).then(async (streak) => {
        if (streak < 2 || cheeredStreakOn === today() || !friend.isConnected) return;
        const logged = await loggingStreak(addDays(today(), -1));
        if (streak <= logged) return; // nothing logged today yet
        cheeredStreakOn = today();
        friend.hop();
        say.textContent = withName(`{name}: 🔥 ${streak} days in a row! Yay!`);
      }).catch((err) => console.error(err));

      root.append(
        el('div', { className: 'home-greeting home-greeting--buddy' }, [
          el('div', { className: 'home-greeting__words' }, [
            el('h2', { className: 'home-greeting__title', text: `${greeting}${name ? `, ${name}` : ''} ${emoji}` }),
            el('p', { className: 'muted home-greeting__date', text: formatDate(today(), { weekday: true }) }),
            say,
          ]),
          buddyButton,
        ]),
        sleepSlot,
        summaryCard(),
        readingBanner(),
        todaySection(menu.order),
        installSlot,
        tiles,
        quickAdd(menu.order),
      );
      fillTileStats(tiles);
      updateInstallSlot();
    }

    // Before each screen: update the title bar and highlight the right menu button.
    let firstScreen = true;
    function onChange(name) {
      if (sheet.open) sheet.close();
      const mod = modules[name] || (name === 'settings' ? { emoji: '⚙️', label: 'Settings' } : null);
      titleEl.textContent = mod ? mod.label : 'Lifetracker';
      badgeEl.replaceChildren(modules[name] ? badge(name)
        : mod ? el('span', { className: 'badge', 'aria-hidden': 'true', text: mod.emoji }) : '');
      document.title = mod ? `${mod.label} · Lifetracker` : 'Lifetracker';
      highlight(name);
      if (!firstScreen) titleEl.focus({ preventScroll: true });
      firstScreen = false;
    }

    // Highlights the right menu button for a screen.
    let currentScreen = '';
    function highlight(name) {
      currentScreen = name;
      const activeKey = moreModules.includes(name) ? 'more' : name;
      // ⚙️ in the title bar looks "pressed" while you're on Settings.
      const settingsLink = document.getElementById('settings-link');
      settingsLink.classList.toggle('is-active', name === 'settings');
      if (name === 'settings') settingsLink.setAttribute('aria-current', 'page');
      else settingsLink.removeAttribute('aria-current');
      for (const item of nav.querySelectorAll('.nav-item')) {
        const active = item.dataset.key === activeKey;
        item.classList.toggle('is-active', active);
        if (item.tagName === 'A') {
          if (active) item.setAttribute('aria-current', 'page');
          else item.removeAttribute('aria-current');
        }
      }
      // The "More" button takes the colour of the module it's showing.
      moreButton.className = `nav-item${activeKey === 'more' ? ` is-active mod-${name}` : ''}`;
    }

    // 👋 First time on this phone: only the buddy, asking your name (and its own), then Home (REFINE-4).
    const root = document.documentElement;
    try {
      const { needsWelcome, welcome } = await import('./core/welcome.js');
      if (await needsWelcome()) {
        root.classList.add('is-welcome');
        root.classList.remove('app-starting');
        await welcome();
        root.classList.remove('is-welcome');
      }
    } catch (err) {
      console.error(err);
      root.classList.remove('is-welcome');
    }
    root.classList.remove('app-starting');

    startRouter({
      outlet: app, home: homeScreen, onChange,
      screens: { settings: () => import('./core/settings.js') },
    });

    // ⏰ Task reminders (TSK-3): checked while the app is open; missed ones show as a banner on opening.
    import('./tasks/index.js')
      .then(({ startReminders }) => startReminders())
      .catch((err) => console.error(err));
  </script>
</body>
</html>
